# config file for training a model for https://github.com/SylviaWhittle/plasmid-net
# training data dir is base_dir / "data" with subdirs for each sample type
batch_size: 8
epochs: 50
learning_rate: 1e-4
run_name: "" # blank for auto-generated name
path_base: "/Users/sylvi/topo_data/dna-damage-unet/"
path_data: "data"
path_bundle_save_dir: "trained/"
path_predictions: "trained/predictions"
save_only_best_loss_model: false
model_input_size: 256
normalisation:
  vmin: -1.0
  vmax: 5.0
sample_types: ["cesium"]
num_samples_per_type: [1000]
allow_too_few_samples: true
random_seed: 0
augmentation:
  flip_rotate: true
  scale: true
  scale_max_zoom_percentage: 0.2
extra_channels:
  hessian:
    enabled: false # whether to use hessian filter as an extra channel
    sigmas: [3.0] # list of sigmas for hessian filter
    normalised: true # whether to normalise the hessian filter output
evaluation:
  classical_threshold: 1.1 # height threshold in nm for comparing classical and dl




